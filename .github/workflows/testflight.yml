name: TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MuseBuddy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: MuseBuddy/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build-and-submit:
    name: Build and Submit
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: MuseBuddy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: MuseBuddy/pnpm-lock.yaml

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Configure App Store Connect app id
        run: |
          node -e '
            const fs = require("fs");
            const ascAppId = process.env.ASC_APP_ID;
            if (!ascAppId) {
              throw new Error("Missing GitHub Actions variable ASC_APP_ID");
            }

            const easJson = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            easJson.submit ??= {};
            easJson.submit.production ??= {};
            easJson.submit.production.ios ??= {};
            easJson.submit.production.ios.ascAppId = ascAppId;
            fs.writeFileSync("eas.json", `${JSON.stringify(easJson, null, 2)}\n`);
          '
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}

      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit --non-interactive
